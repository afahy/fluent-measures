name: Evidence

# Summarizes what a PR changes in parseMeasurement's results and rates its risk, so that the
# maintainer can judge the PR from its evidence (.github/scripts/evidence.mjs). The summary is on
# the run's page. The risk rating is information for the maintainer. No label or merge rule uses
# it (AFA-164).
on:
  pull_request:
    branches: [main]
    # edited: the check reads the PR body, so it runs again when the body changes.
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Evidence of changed results
    # Edits to closed pull requests also send `edited`.
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its parents. HEAD^1 is the base branch.
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Corpus-only fixes also need both parsers, even when no package file changed.
      - name: Decide whether to build evidence
        id: inputs
        run: |
          if git diff --quiet HEAD^1 HEAD -- src/ package.json pnpm-lock.yaml tsup.config.ts tests/corpus/measurements.jsonl; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the base build
        id: base-checkout
        if: steps.inputs.outputs.build == 'true'
        continue-on-error: true
        run: git worktree add --detach "$RUNNER_TEMP/base" HEAD^1

      - name: Set up the PR's pnpm
        id: head-pnpm
        if: steps.inputs.outputs.build == 'true'
        continue-on-error: true
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Build and measure the PR
        if: always() && steps.inputs.outputs.build == 'true'
        env:
          PNPM_SETUP: ${{ steps.head-pnpm.outcome }}
        run: node .github/scripts/evidence-build.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/build-head.json" "$RUNNER_TEMP/size-head.json" "$PNPM_SETUP" --require-install

      - name: Set up the base revision's pnpm
        id: base-pnpm
        if: always() && steps.inputs.outputs.build == 'true' && steps.base-checkout.outcome == 'success'
        continue-on-error: true
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ${{ runner.temp }}/base/package.json
          dest: ${{ runner.temp }}/pnpm-base

      - name: Build and measure the base revision
        if: always() && steps.inputs.outputs.build == 'true'
        env:
          PNPM_SETUP: ${{ steps.base-pnpm.outcome }}
        run: node .github/scripts/evidence-build.mjs "$RUNNER_TEMP/base" "$RUNNER_TEMP/build-base.json" "$RUNNER_TEMP/size-base.json" "$PNPM_SETUP"

      - name: Summarize the changed results and rate the risk
        if: always()
        env:
          # The body goes in through the environment, so that its text can't change the script.
          PR_BODY: ${{ github.event.pull_request.body }}
          SIZE_BASE: ${{ runner.temp }}/size-base.json
          SIZE_HEAD: ${{ runner.temp }}/size-head.json
          CORPUS_BASE_MODULE: ${{ runner.temp }}/base/dist/index.js
          CORPUS_HEAD_MODULE: ${{ github.workspace }}/dist/index.js
          BUILD_BASE: ${{ runner.temp }}/build-base.json
          BUILD_HEAD: ${{ runner.temp }}/build-head.json
        # The script from the base branch rates the PR, so a change to the script doesn't rate its
        # own PR. This workflow file still comes from the PR, so the script rates a change to it
        # high. A base branch without the script uses the PR's.
        run: |
          script=.github/scripts/evidence.mjs
          if git cat-file -e "HEAD^1:$script" 2> /dev/null; then
            # Copy all of the base branch's scripts, so that each module that the script imports is
            # there. They go inside the workspace, so that an imported package finds node_modules.
            mkdir .evidence-base
            git archive HEAD^1 .github/scripts | tar -x -C .evidence-base
            script=".evidence-base/$script"
          fi
          node "$script"
