name: Claude review

# Asks Claude for a code review of a PR when it opens, reopens or becomes ready for review
# (AFA-28). It runs on the maintainer's Claude subscription through the CLAUDE_CODE_OAUTH_TOKEN
# secret, which `claude setup-token` prints. The agent sessions share that subscription's usage
# limits, so it doesn't review each push. Claude only posts comments, so the review doesn't block
# a merge.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    name: Claude review
    # A draft gets its review when it becomes ready.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The action exchanges this for a token of the Claude GitHub App, which posts the comments.
      id-token: write
    env:
      # A PR from a fork, or from Dependabot, gets no secrets. Without the token, each step is
      # skipped, so the job passes and fails no PR.
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      # The commit of the v1 tag, so a moved tag can't change what runs with the secret.
      - uses: anthropics/claude-code-action@be2241e97a8eca37e3694756abe3bbf1f45a4b25 # v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment"
