name: PR status

# Sets the `pr-status` commit status on a PR's head commit: what the PR waits on, from
# .github/scripts/pr-state.mjs. It's informational, not a required check. Events other than
# pull_request run this file from main, so changes here take effect once they merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created, edited]
  # CodeRabbit's review status.
  status:
  # GitHub doesn't send check_suite events for suites that Actions creates, so follow the
  # workflows that a PR's checks come from.
  workflow_run:
    workflows: [CI, Commitlint, Regression test]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pr-status-${{ github.event.pull_request.number || github.event.issue.number || github.event.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  status:
    name: Set the PR status
    # Its own status doesn't need another run. Statuses set with GITHUB_TOKEN don't start
    # workflows anyway, so this is a second guard.
    if: github.event_name != 'status' || github.event.context != 'pr-status'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      pull-requests: read
      issues: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set the status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-status-check.mjs
