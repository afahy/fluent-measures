name: PR status

# Sets the `pr-status` commit status on a PR's head commit: what the PR waits on, from
# .github/scripts/pr-state.mjs. It's informational, not a required check. Events other than
# pull_request, pull_request_review and pull_request_review_comment run this file from main, so
# changes here take effect for them once they merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  # A deleted reply can leave a bot's thread with no reply again.
  pull_request_review_comment:
    types: [created, deleted]
  issue_comment:
    types: [created, edited, deleted]
  # CodeRabbit's review status.
  status:
  # GitHub doesn't send check_suite events for suites that Actions creates, so follow the
  # workflows that a PR's checks come from. They can start again without a push, for example
  # after a title edit or a re-run, so a start counts as well as the end. GitHub sends
  # `requested` only for new runs, but `in_progress` for re-runs too.
  workflow_run:
    workflows: [CI, Commitlint, Regression test]
    types: [in_progress, completed]
  # A bot's or CI's time running out sends no event, and nor does Codex's 👍 or 👀, so check
  # every open PR now and then. Each PR costs about 13 requests of the token's 1,000 an hour,
  # so not more often than this.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Runs for the same PR take turns, so an older answer can't overwrite a newer one. A run that is
# already going finishes; a newer one only replaces a run that is still queued, and it reads the
# PR again anyway. A workflow run for a fork's PR lists no PRs, so its group is the fork's
# repository and branch.
concurrency:
  group: pr-status-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.sha || (github.event.workflow_run && format('{0}:{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch)) || github.event_name }}
  cancel-in-progress: false

jobs:
  status:
    name: Set the PR status
    # Skips its own status (statuses set with GITHUB_TOKEN don't start workflows anyway), comments
    # on issues that aren't PRs, and PR events from forks, whose token can't set a status.
    if: >-
      (github.event_name != 'status' || github.event.context != 'pr-status') &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      pull-requests: read
      issues: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set the status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-status-check.mjs
