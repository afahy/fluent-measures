name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build documentation artifact
        run: node .github/scripts/docs-build.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Generated from production docs and root Markdown; excludes local preview assets.
          path: build/docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Read the uploaded artifact, not a rebuild or the event's possibly different SHA.
      - uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: Verify public documentation
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/pages-expected"
          tar -xf artifact.tar -C "$RUNNER_TEMP/pages-expected"
          node .github/scripts/docs-verify-public.mjs "$RUNNER_TEMP/pages-expected"
