name: Request release documentation

# The authorized local release command pushes its version tag after npm publication.
# Dispatch on main to respect the existing github-pages environment's main-only policy.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: write

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request verification of the published version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node -e 'if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(process.env.TAG)) process.exit(1)'
          gh workflow run deploy-docs.yml --ref main --field "version=${TAG#v}"
