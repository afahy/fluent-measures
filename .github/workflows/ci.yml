name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:unit:coverage

      - name: Type check
        run: pnpm test:types

      - name: Build
        run: pnpm build

      - name: Check bundle size
        run: pnpm check:size

      # A change to an exported type must show in api-report.d.ts.
      - name: Check the exported types
        run: pnpm check:api

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      # pnpm pack runs the prepack script, which cleans dist/ and builds, so this step tests it too.
      - name: Pack
        id: pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Install the tarball into an empty project
        id: install
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init --yes
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz

      - name: Import the package from ESM
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { parseMeasurement } from '@afahy/fluent-measures';

          const { value, unit } = parseMeasurement('6 ft');
          assert.deepEqual({ value, unit }, { value: 6, unit: 'ft' });

          const resolved = import.meta.resolve('@afahy/fluent-measures');
          assert.ok(resolved.endsWith('/dist/index.js'), `import resolved to ${resolved}`);

          // Bundlers that ignore exports read module, so it must name the same file.
          const manifest = import.meta.resolve('@afahy/fluent-measures/package.json');
          const { module } = JSON.parse(readFileSync(new URL(manifest), 'utf8'));
          assert.equal(new URL(module, manifest).href, resolved, `module is ${module}`);
          EOF

      - name: Require the package from CJS
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node --input-type=commonjs <<'EOF'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { parseMeasurement } = require('@afahy/fluent-measures');

          const { value, unit } = parseMeasurement('6 ft');
          assert.deepEqual({ value, unit }, { value: 6, unit: 'ft' });

          // Node 22+ can require() an ESM file, so check that require picks the CJS build.
          const resolved = require.resolve('@afahy/fluent-measures');
          assert.ok(resolved.endsWith('/dist/index.cjs'), `require resolved to ${resolved}`);

          // Tools that ignore exports read main, so it must name the same file.
          const manifest = require.resolve('@afahy/fluent-measures/package.json');
          const { main } = require(manifest);
          assert.equal(path.resolve(path.dirname(manifest), main), resolved, `main is ${main}`);
          EOF

      # The tests of results import the installed tarball in place of src/, once through import and
      # once through require. So they also check what the build does to the code.
      - name: Run the tests of results against the installed package
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          FLUENT_MEASURES_PACKAGE_DIR: ${{ runner.temp }}/consumer
        run: pnpm test:package

      # publint and attw read the tarball and don't depend on the Node version, so they run
      # in one matrix leg.
      - name: Lint the package with publint
        if: ${{ !cancelled() && steps.pack.outcome == 'success' && matrix.node-version == 24 }}
        run: npx publint@0.3.24 --strict "$RUNNER_TEMP"/pack/*.tgz

      - name: Check the package types with Are the Types Wrong
        if: ${{ !cancelled() && steps.pack.outcome == 'success' && matrix.node-version == 24 }}
        run: npx @arethetypeswrong/cli@0.18.5 "$RUNNER_TEMP"/pack/*.tgz

  mutation-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hash: ${{ steps.inputs.outputs.hash }}
      tools: ${{ steps.inputs.outputs.tools }}
      resumed: ${{ endsWith(steps.main.outputs.cache-matched-key, '-stopped') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its parents; HEAD^1 is the pull request base.
          fetch-depth: 2

      - uses: ./.github/actions/setup
        with:
          node-version: 22

      # Stryker's incremental mode reuses the result of each mutant whose code and killing tests
      # haven't changed (AFA-111). It compares the source files and the test files, but not the
      # files that tests read, the packages or these jobs. So their hash is part of the cache key,
      # and a change to one of them starts a full run. A pull request starts from its own last
      # run, or from main's. The key of main's own results hashes only the packages and the tool
      # configs, because those results aren't exact anyway.
      # Omit only audited release metadata/commands, unrelated jobs and tooling-only fixtures.
      # Unknown inputs stay hashed. Projection files live outside the shared inventory artifact.
      - name: Select the inputs that can change mutation results
        run: node .github/scripts/mutation-cache-inputs.mjs

      - name: Hash the inputs that Stryker doesn't compare
        id: inputs
        run: |
          set -euo pipefail
          echo "hash=${{ hashFiles('reports/mutation-cache/package.json', 'pnpm-lock.yaml', 'tsconfig.json', 'stryker.config.json', 'vitest.config.ts', '.github/scripts/mutation-*.mjs', '.github/scripts/stryker-shard.config.mjs', '.github/scripts/changed-lines.mjs', '.github/scripts/workflow-commands.mjs', 'reports/mutation-cache/ci.yml', '.github/actions/setup/action.yml', 'README.md', 'PARSING.md', 'docs/index.html', 'tests/**', '!tests/**/*.test.ts', '!tests/fixtures/pr-status/**', '!tests/fixtures/late-bot-findings/**', '!tests/fixtures/mutation/**') }}" >> "$GITHUB_OUTPUT"
          echo "tools=${{ hashFiles('reports/mutation-cache/package.json', 'pnpm-lock.yaml', 'tsconfig.json', 'stryker.config.json', 'vitest.config.ts') }}" >> "$GITHUB_OUTPUT"

      # Stryker compares only each mutant's own code and the tests that cover it. A change elsewhere
      # in the same source file or in another one can change how the tests treat the mutant.
      # Incremental mode doesn't check that. So only a pull request restores these results, and
      # main saves them only from a run that started from no results. A pull request's own later
      # runs can reuse its earlier results. A re-run of the job runs every mutant, so a pull request
      # can get a full run.
      - uses: actions/cache/restore@v4
        if: github.event_name != 'push' && github.run_attempt == 1
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ steps.inputs.outputs.hash }}-${{ github.sha }}
          restore-keys: stryker-incremental-${{ steps.inputs.outputs.hash }}-

      # Each run on main also saves its results under a key that ends in "-stopped" when `timeout`
      # stopped it, or in "-ended" (AFA-139). A push to main restores the newest of these entries,
      # also when the run before it hasn't saved yet. The newest entry is the one saved last. So
      # when runs overlap, it can come from an older commit than the last run that ended.
      - id: main
        uses: actions/cache/restore@v4
        if: github.event_name == 'push' && github.run_attempt == 1
        with:
          path: reports/stryker-incremental.json
          key: stryker-main-${{ steps.inputs.outputs.tools }}-${{ github.sha }}
          restore-keys: stryker-main-${{ steps.inputs.outputs.tools }}-

      # Only a stopped run's results carry over, so this run tests the mutants that it didn't reach.
      # Those results come from an earlier commit, so they aren't exact. After a run that ended, a
      # push starts from no results and runs every mutant.
      - name: Start from no results after a run that ended
        if: steps.main.outputs.cache-matched-key && !endsWith(steps.main.outputs.cache-matched-key, '-stopped')
        run: rm -f reports/stryker-incremental.json

      # Stryker compares mutant spans, not git lines. Retest each changed source file even when
      # only another expression or formatting on the same line changed, or a prior PR run cached it.
      - name: Refresh mutation results for changed source files
        if: github.event_name == 'pull_request'
        run: node .github/scripts/mutation-check.mjs --prepare reports/stryker-incremental.json

      # The cold dry run validates the tests and instruments the actual full selection. Its
      # current inventory is independent of the four result sets; no historical count is used.
      - name: Full mutant inventory and shared cache inputs
        run: node .github/scripts/mutation-shards.mjs inventory

      - uses: actions/upload-artifact@v4
        with:
          name: mutation-inputs
          path: reports/mutation-inputs/
          if-no-files-found: error
          overwrite: true

  mutation:
    needs: mutation-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [parse-start, parse-end, tokenize, rest]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: 22

      # Restore once above, then give every shard the identical prepared cache and inventory.
      - uses: actions/download-artifact@v4
        with:
          name: mutation-inputs
          path: reports/mutation-inputs/

      - name: Select shard and trim out-of-scope cached mutants
        id: selection
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
        run: node .github/scripts/mutation-shards.mjs prepare "$MUTATION_SHARD"

      # Preserve the stopped-run handoff: SIGINT gives Stryker time to save partial results.
      # Shards do not check break. Only the merged report's score can fail that threshold.
      - name: Mutation tests
        id: mutation
        env:
          MUTATE: ${{ steps.selection.outputs.mutate }}
          MUTATION_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          command -v timeout pgrep seq > /dev/null
          rm -f reports/mutation/mutation.json reports/mutation-shard.json
          status=0
          timeout --signal=INT 27m pnpm test:mutation .github/scripts/stryker-shard.config.mjs --incremental --mutate "$MUTATE" || status=$?
          if [ "$status" -eq 124 ]; then
            echo "stopped=true" >> "$GITHUB_OUTPUT"
            for _ in $(seq 120); do pgrep -f stryker > /dev/null || break; sleep 1; done
          fi
          node .github/scripts/mutation-shards.mjs pack "$MUTATION_SHARD" "$status"
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.mutation.outcome == 'success' || steps.mutation.outcome == 'failure') }}
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation-shard.json
          if-no-files-found: error
          overwrite: true

  mutation-report:
    if: ${{ !cancelled() && needs.mutation-inventory.result == 'success' }}
    needs: [mutation-inventory, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: mutation-inputs
          path: reports/mutation-inputs/

      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-*
          path: reports/downloads/

      - name: Collect the four shard artifacts
        run: |
          mkdir -p reports/shards
          for shard in parse-start parse-end tokenize rest; do
            mkdir -p "reports/shards/$shard"
            cp "reports/downloads/mutation-shard-$shard/mutation-shard.json" "reports/shards/$shard/"
          done

      # A missing, duplicate, stale or incomplete inventory fails closed. A stopped run saves a
      # validated partial cache but fails this job. It never writes a complete mutation report.
      - name: Merge reports and check the aggregate score
        id: aggregate
        run: node .github/scripts/mutation-shards.mjs merge

      - name: Mutants on changed lines are killed
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.aggregate.outputs.valid == 'true' && steps.aggregate.outputs.stopped == 'false' }}
        run: node .github/scripts/mutation-check.mjs --report reports/mutation/mutation.json

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.aggregate.outputs.valid == 'true' }}
        with:
          name: mutation-report
          path: |
            reports/mutation/mutation.json
            reports/stryker-incremental.json
          if-no-files-found: error
          overwrite: true

      # Only cold/full main results or PR results enter the exact PR cache namespace. Results
      # resumed from a stopped main run remain in main's separate namespace (AFA-139).
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.aggregate.outputs.valid == 'true' && needs.mutation-inventory.outputs.resumed != 'true' }}
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ needs.mutation-inventory.outputs.hash }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.aggregate.outputs.valid == 'true' && github.event_name == 'push' }}
        with:
          path: reports/stryker-incremental.json
          key: stryker-main-${{ needs.mutation-inventory.outputs.tools }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.aggregate.outputs.stopped == 'true' && 'stopped' || 'ended' }}

  ci-ok:
    if: always()
    needs: [test, package, mutation, mutation-report]
    runs-on: ubuntu-latest
    steps:
      - name: Check all CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
