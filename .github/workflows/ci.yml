name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:unit:coverage

      - name: Type check
        run: pnpm test:types

      - name: Build
        run: pnpm build

      - name: Check bundle size
        run: pnpm check:size

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      # pnpm pack runs the prepack script, which cleans dist/ and builds, so this step tests it too.
      - name: Pack
        id: pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Install the tarball into an empty project
        id: install
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init --yes
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz

      - name: Import the package from ESM
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { parseMeasurement } from '@afahy/fluent-measures';

          const { value, unit } = parseMeasurement('6 ft');
          assert.deepEqual({ value, unit }, { value: 6, unit: 'ft' });

          const resolved = import.meta.resolve('@afahy/fluent-measures');
          assert.ok(resolved.endsWith('/dist/index.js'), `import resolved to ${resolved}`);

          // Bundlers that ignore exports read module, so it must name the same file.
          const manifest = import.meta.resolve('@afahy/fluent-measures/package.json');
          const { module } = JSON.parse(readFileSync(new URL(manifest), 'utf8'));
          assert.equal(new URL(module, manifest).href, resolved, `module is ${module}`);
          EOF

      - name: Require the package from CJS
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node --input-type=commonjs <<'EOF'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { parseMeasurement } = require('@afahy/fluent-measures');

          const { value, unit } = parseMeasurement('6 ft');
          assert.deepEqual({ value, unit }, { value: 6, unit: 'ft' });

          // Node 22+ can require() an ESM file, so check that require picks the CJS build.
          const resolved = require.resolve('@afahy/fluent-measures');
          assert.ok(resolved.endsWith('/dist/index.cjs'), `require resolved to ${resolved}`);

          // Tools that ignore exports read main, so it must name the same file.
          const manifest = require.resolve('@afahy/fluent-measures/package.json');
          const { main } = require(manifest);
          assert.equal(path.resolve(path.dirname(manifest), main), resolved, `main is ${main}`);
          EOF

      # publint and attw read the tarball and don't depend on the Node version, so they run
      # in one matrix leg.
      - name: Lint the package with publint
        if: ${{ !cancelled() && steps.pack.outcome == 'success' && matrix.node-version == 24 }}
        run: npx publint@0.3.24 --strict "$RUNNER_TEMP"/pack/*.tgz

      - name: Check the package types with Are the Types Wrong
        if: ${{ !cancelled() && steps.pack.outcome == 'success' && matrix.node-version == 24 }}
        run: npx @arethetypeswrong/cli@0.18.5 "$RUNNER_TEMP"/pack/*.tgz

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: 22

      - name: Mutation tests
        run: pnpm test:mutation

  ci-ok:
    if: always()
    needs: [test, package, mutation]
    runs-on: ubuntu-latest
    steps:
      - name: Check all CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
